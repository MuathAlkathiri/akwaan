name: akwaan

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_BASE_URL: http://localhost:3002
      # LEGACY_PERSISTED_IDENTIFIER: `lammah-quiz` is the live database name and
      # predates the Akwaan rename. Do not "fix" it — see the volumes note below.
      MONGODB_URI: ${BACKEND_MONGODB_URI:-mongodb://mongodb:27017/lammah-quiz?replicaSet=rs0}
      LMSTUDIO_BASE_URL: ${BACKEND_LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_BASE_URL: ${BACKEND_LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      UPLOADS_DIR: /app/uploads
      MUSIC_QUESTION_CATEGORY_SLUG: ${MUSIC_QUESTION_CATEGORY_SLUG:-songs}
      MUSIC_DELETE_ORIGINAL_AFTER_SNIPPET: ${MUSIC_DELETE_ORIGINAL_AFTER_SNIPPET:-false}
      ALLOW_YOUTUBE_ASSET_DOWNLOADS: ${ALLOW_YOUTUBE_ASSET_DOWNLOADS:-true}
      AI_QUESTION_GENERATION_ENABLED: ${AI_QUESTION_GENERATION_ENABLED:-false}
      AI_ALIAS_DIAGNOSTICS: ${BACKEND_AI_ALIAS_DIAGNOSTICS:-false}
      AUDIO_AUTO_SELECT_FIRST_CANDIDATE: ${AUDIO_AUTO_SELECT_FIRST_CANDIDATE:-false}
      JIKAN_PROVIDER_ENABLED: ${JIKAN_PROVIDER_ENABLED:-true}
      JIKAN_API_BASE_URL: ${JIKAN_API_BASE_URL:-https://api.jikan.moe/v4}
      JIKAN_REQUEST_TIMEOUT_MS: ${JIKAN_REQUEST_TIMEOUT_MS:-10000}
      JIKAN_CACHE_TTL_MS: ${JIKAN_CACHE_TTL_MS:-86400000}
      JIKAN_NEGATIVE_CACHE_TTL_MS: ${JIKAN_NEGATIVE_CACHE_TTL_MS:-600000}
      WIGOLO_EXECUTABLE_PATH: /app/node_modules/.bin/wigolo
      WIGOLO_CACHE_FILE: /app/.cache/entity-verification.json
    ports:
      - "3002:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3002
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }\" mongodb://127.0.0.1:27017/admin | grep 1",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  # Pinned to their pre-rename names on purpose. Compose otherwise derives volume
  # names from the project name, so renaming the project/directory to `akwaan`
  # would silently bind a brand new empty volume and orphan the live data.
  # LEGACY_PERSISTED_IDENTIFIER — the `lammah-game_` prefix is storage identity,
  # not branding. Do not "clean up" without a verified volume migration.
  # `up` prints "volume ... was created for project lammah-game (expected akwaan)".
  # That warning is expected and correct: it means Compose found and reused the
  # existing data instead of creating an empty volume. Nothing to fix.
  backend_uploads:
    name: lammah-game_backend_uploads
  mongodb_data:
    name: lammah-game_mongodb_data
