<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc850" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1c1c30" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="20" fill="#1c1c30"/>
  <circle cx="400" cy="200" r="250" fill="url(#glow)"/>
  <rect x="150" y="350" width="500" height="7" rx="3.5" fill="#ffc832" opacity="0.35"/>

  <!-- Stars -->
  <g fill="#ffd700">
    <path d="M170,110 q5,-15 15,-5 q-10,0 -5,15 q-5,-10 -15,-5 q10,-5 0,-15 q0,10 -10,5 q10,5 5,15 q-5,-10 -15,-5 q10,-5 5,-10z"/>
    <path d="M630,100 l4,-12 4,12 12,-4 -12,4 12,12 -12,-4 -4,12 -4,-12 -12,4 12,-4 -12,-12z" fill="#ffdc40"/>
    <path d="M600,300 l4,-10 4,10 10,-4 -10,4 10,10 -10,-4 -4,10 -4,-10 -10,4 10,-4 -10,-10z" fill="#ffcd28"/>
    <path d="M170,290 l5,-13 5,13 13,-5 -13,5 13,13 -13,-5 -5,13 -5,-13 -13,5 13,-5 -13,-13z"/>
  </g>

  <!-- 4-point sparkles -->
  <g fill="#90ff90">
    <path d="M120,210 q-10,0 -10,-10 q0,-10 10,-10 q10,0 10,10 q0,10 -10,10z" transform="rotate(45,120,210)"/>
  </g>
  <g fill="#ffb440">
    <path d="M680,180 q-8,0 -8,-8 q0,-8 8,-8 q8,0 8,8 q0,8 -8,8z" transform="rotate(45,680,180)"/>
  </g>
  <g fill="#ffff90">
    <path d="M430,70 q-8,0 -8,-8 q0,-8 8,-8 q8,0 8,8 q0,8 -8,8z" transform="rotate(45,430,70)"/>
  </g>

  <!-- Glow dots -->
  <circle cx="50" cy="80" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="750" cy="60" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="680" cy="350" r="2" fill="#fff" opacity="0.25"/>
  <circle cx="100" cy="340" r="1.5" fill="#fff" opacity="0.35"/>
  <circle cx="300" cy="60" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="500" cy="370" r="1.5" fill="#fff" opacity="0.2"/>
  <circle cx="720" cy="280" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="60" cy="160" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="740" cy="130" r="1" fill="#fff" opacity="0.25"/>

  <!-- ========== LOGO: لـ + [م = watermelon] + ـة ========== -->

  <!-- 
    Arabic text rendered as individual pieces for precise control.
    The word is لمـمة where:
    - لـ is lam (initial form, rightmost)
    - م is meem drawn as watermelon (middle)
    - ـة is ta marbuta (final form, leftmost)
    
    RTL order (right to left): لـ → م watermelon → ـة
  -->

  <!-- 1) لـ (Lam with connector) -->
  <g filter="url(#shadow)">
    <text x="555" y="280" font-family="System UI, -apple-system, 'Geeza Pro', 'Traditional Arabic', 'Arabic Typesetting', sans-serif" font-size="160" font-weight="bold" fill="#ebebf5" text-anchor="start">ل‍ـ</text>
  </g>

  <!-- 2) م as Watermelon (middle character, drawn as letter meem shape) -->
  <g transform="translate(455, 195)">
    <!-- The م letterform body is roughly a circle/oval ~65px wide, with a tail going down-left -->
    
    <!-- م body = watermelon round -->
    <!-- Green outer rind -->
    <ellipse cx="0" cy="0" rx="42" ry="48" fill="#2ea02e"/>
    
    <!-- Dark green stripes on the rind -->
    <path d="M-30,-20 Q-20,-35 0,-45" stroke="#146e14" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M10,-43 Q25,-35 35,-20" stroke="#146e14" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M38,5 Q35,20 25,35" stroke="#146e14" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-25,35 Q-10,42 5,40" stroke="#146e14" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-35,15 Q-40,0 -38,-10" stroke="#146e14" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- White inner rind -->
    <ellipse cx="0" cy="0" rx="35" ry="40" fill="#c8f0c8"/>
    
    <!-- Red flesh -->
    <ellipse cx="0" cy="0" rx="30" ry="35" fill="#dc2d2d"/>
    <ellipse cx="0" cy="0" rx="25" ry="30" fill="#eb4646"/>
    
    <!-- Seeds -->
    <ellipse cx="-12" cy="-12" rx="3" ry="4" fill="#1a1410" transform="rotate(-15,-12,-12)"/>
    <ellipse cx="12" cy="-10" rx="3" ry="4" fill="#1a1410" transform="rotate(10,12,-10)"/>
    <ellipse cx="-15" cy="8" rx="3" ry="4" fill="#1a1410" transform="rotate(-5,-15,8)"/>
    <ellipse cx="14" cy="12" rx="3" ry="4" fill="#1a1410" transform="rotate(20,14,12)"/>
    <ellipse cx="-2" cy="18" rx="2.5" ry="3.5" fill="#1a1410"/>
    <ellipse cx="3" cy="-4" rx="2.5" ry="3.5" fill="#1a1410"/>
    <ellipse cx="-5" cy="3" rx="2.5" ry="3.5" fill="#1a1410"/>
    
    <!-- Highlight -->
    <ellipse cx="-8" cy="-15" rx="10" ry="6" fill="#fff" opacity="0.2" transform="rotate(-15,-8,-15)"/>
    
    <!-- م tail (the descender that makes it a meem) - bottom-left extending stroke -->
    <path d="M-30,20 Q-45,40 -50,65 Q-48,70 -42,68 Q-38,60 -35,55 L-25,35" 
          fill="#2ea02e" stroke="none"/>
    <!-- Tail highlight and detail -->
    <path d="M-30,20 Q-45,40 -50,65 Q-48,70 -42,68 Q-38,60 -35,55 L-25,35" 
          fill="none" stroke="#146e14" stroke-width="2" opacity="0.5"/>
    
    <!-- م connector to the right (connects to ل) -->
    <line x1="35" y1="-5" x2="65" y2="-8" stroke="#2ea02e" stroke-width="8" stroke-linecap="round"/>
    <!-- م connector to the left (connects to ة) -->
    <line x1="-42" y1="-5" x2="-70" y2="-8" stroke="#2ea02e" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Small كرشة (meem dent/indentation on top) -->
    <path d="M-15,-43 Q0,-35 15,-44" stroke="#146e14" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 3) ـة (Ta marbuta with connector) -->
  <g filter="url(#shadow)">
    <text x="378" y="280" font-family="System UI, -apple-system, 'Geeza Pro', 'Traditional Arabic', 'Arabic Typesetting', sans-serif" font-size="160" font-weight="bold" fill="#ebebf5" text-anchor="start">ـة</text>
  </g>

  <!-- ========== TAGLINE ========== -->
  <text x="400" y="340" font-family="System UI, -apple-system, 'Geeza Pro', 'Arabic Typesetting', sans-serif" font-size="32" fill="#a0a0be" text-anchor="middle">لعبة ترفيهية تنافسية</text>

  <!-- Version -->
  <text x="740" y="28" font-family="sans-serif" font-size="13" fill="#646482" text-anchor="end">v1.0</text>
</svg>
