services:
  mongodb-test:
    image: mongo:7
    hostname: mongodb-test
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27018:27017"]
    tmpfs: [/data/db]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb-test:27017'}]}).ok }\" mongodb://127.0.0.1:27017/admin | grep 1",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  backend-integration:
    image: node:20-alpine
    working_dir: /workspace
    volumes: [".:/workspace"]
    environment:
      NODE_ENV: test
      TEST_MONGODB_URI: mongodb://mongodb-test:27017/akwaan_integration_test?replicaSet=rs0
      MONGODB_URI: mongodb://mongodb-test:27017/akwaan_integration_test?replicaSet=rs0
      JWT_SECRET: docker-integration-only-secret
      EXTERNAL_INTEGRATIONS_DISABLED: "true"
      NODE_PATH: /workspace/backend/node_modules:/workspace/node_modules
    command: npm run test:backend:integration
    depends_on:
      mongodb-test: { condition: service_healthy }
    profiles: ["integration"]

  media-integration:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    working_dir: /app
    # The backend image is Debian (node:20-bookworm-slim), not Alpine, so the
    # `apk` this used to run never existed and the profile could not start at
    # all. Note this does not explain the music suite: ffmpeg and ffprobe are
    # both present in the integration container and music still fails there,
    # so its 500 has a different cause than the one on record.
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends ffmpeg && npm run test:media:integration"
    profiles: ["media"]

  backend-e2e:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    working_dir: /app
    environment:
      NODE_ENV: test
      TEST_MONGODB_URI: mongodb://mongodb-test:27017/akwaan_e2e_test?replicaSet=rs0
      MONGODB_URI: mongodb://mongodb-test:27017/akwaan_e2e_test?replicaSet=rs0
      JWT_SECRET: docker-e2e-only-secret
      EXTERNAL_INTEGRATIONS_DISABLED: "true"
      PORT: 3000
      NODE_PATH: /app/backend/node_modules:/app/node_modules
      AI_PROVIDER: lmstudio
      LMSTUDIO_BASE_URL: http://127.0.0.1:9/v1
      CORS_ORIGINS: http://127.0.0.1:3201
    command: sh -c "npm run test:fixtures:seed --workspace backend && npm run start --workspace backend"
    ports: ["127.0.0.1:3100:3000"]
    depends_on:
      mongodb-test: { condition: service_healthy }
    profiles: ["e2e"]

  frontend-e2e:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:3100
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3100
    ports: ["127.0.0.1:3201:3001"]
    depends_on: [backend-e2e]
    profiles: ["e2e"]

networks:
  default:
    name: akwaan_integration_default
