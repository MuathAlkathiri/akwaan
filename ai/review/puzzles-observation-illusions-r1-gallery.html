<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akwaan Review Gallery - Observation & Illusions</title>
<style>
  :root { --bg: #f9f6f0; --navy: #1a2942; --gold: #d4af37; --card-bg: #ffffff; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--navy); margin: 0; padding: 20px; }
  h1, h2, h3 { color: var(--navy); margin-top: 0; }
  .header { border-bottom: 2px solid var(--gold); padding-bottom: 15px; margin-bottom: 20px; }
  
  .tabs { display: flex; gap: 10px; margin-bottom: 10px; overflow-x: auto; }
  .tab { padding: 8px 16px; background: #e2dcd0; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
  .tab.active { background: var(--navy); color: #fff; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card { background: var(--card-bg); border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; border: 1px solid #e2dcd0; }
  .card:hover { transform: translateY(-3px); border-color: var(--gold); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .badge { background: var(--gold); color: #fff; padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
  .diff { font-size: 12px; color: #666; }
  .prompt-preview { font-size: 14px; margin: 10px 0; height: 40px; overflow: hidden; }
  .thumb { width: 100%; height: 150px; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; pointer-events: none;}
  
  #detail-view { display: none; background: var(--card-bg); border-radius: 12px; padding: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-secondary { background: #eee; color: #333; margin-left: 10px;}
  .puzzle-stage { width: 100%; max-width: 600px; height: 400px; background: #fafafa; border: 2px solid #e2dcd0; border-radius: 12px; margin: 20px auto; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .puzzle-stage.mobile-view { max-width: 375px; height: 667px; }
  .options-list { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .option { background: #f0f0f0; padding: 10px; border-radius: 8px; text-align: center; }
  .option.correct { background: #d4edda; border: 2px solid #28a745; font-weight: bold;}
  
  .controls { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; display: flex; gap: 15px; align-items: center;}
  .review-btn { font-size: 20px; background: none; border: 1px solid #ccc; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
  .review-btn.selected { background: var(--gold); color: #fff; border-color: var(--gold); }
  .notes { flex-grow: 1; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
  
  .details-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 20px; font-size: 13px; display:none; }
  #error-panel { display: none; background: #ffebeb; color: #cc0000; border: 2px solid #cc0000; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold;}
  .status-bar { margin-bottom: 20px; font-weight: bold; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 8px;}
</style>
</head>
<body>

<div class="header">
  <h1>قوة الملاحظة والخداع البصري</h1>
  <p>R1.2 — Human Product Review Gallery</p>
  <div id="stats"></div>
</div>

<div id="error-panel"></div>

<div class="status-bar" id="render-status">Rendered cards: 0 / 12</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-filter="all" onclick="renderGrid('all')">الكل</div>
  <div class="tab" data-filter="xo" onclick="renderGrid('xo')">Moving XO</div>
  <div class="tab" data-filter="bomb" onclick="renderGrid('bomb')">Bomb</div>
  <div class="tab" data-filter="ryo" onclick="renderGrid('ryo')">اقرأ خصمك</div>
  <div class="tab" data-filter="cls" onclick="renderGrid('cls')">مين أقرب</div>
</div>

<div class="grid" id="gallery-grid"></div>

<div id="detail-view">
  <button class="btn btn-secondary" onclick="closeDetail()">رجوع</button>
  <button class="btn btn-primary" id="reveal-btn" onclick="toggleReveal()">إظهار الإجابة</button>
  <button class="btn btn-secondary" onclick="toggleMobile()">معاينة بحجم الجوال</button>
  <button class="btn btn-secondary" onclick="toggleDetails()">إظهار تفاصيل البناء</button>
  
  <div style="margin-top: 20px;">
    <span class="badge" id="d-mechanic"></span>
    <span class="diff" id="d-diff"></span>
  </div>
  
  <h2 id="d-prompt" style="margin-top: 15px;"></h2>
  
  <div class="puzzle-stage" id="d-stage"></div>
  
  <ul class="options-list" id="d-options"></ul>
  
  <div class="details-box" id="d-details"></div>
  
  <div class="controls">
    <button class="review-btn" id="btn-up" onclick="setReview('up')">👍</button>
    <button class="review-btn" id="btn-warn" onclick="setReview('warn')">🟡</button>
    <button class="review-btn" id="btn-down" onclick="setReview('down')">❌</button>
    <input type="text" class="notes" id="d-notes" placeholder="ملاحظاتي..." onchange="saveNote(this.value)">
  </div>
</div>

      let cut = [[80,20], [50,80], [120,80], [20,80], [150,80]];
      uncut.forEach(p => svg += `<rect x="${p[0]}" y="${p[1]}" width="20" height="20" fill="red" />`);
      cut.forEach(p => svg += `<rect x="${p[0]}" y="${p[1]}" width="20" height="20" fill="red" />`);
      svg += `<line x1="80" y1="10" x2="100" y2="50" stroke="blue" stroke-width="3" />
              <line x1="40" y1="80" x2="140" y2="100" stroke="blue" stroke-width="3" />
              <line x1="10" y1="90" x2="40" y2="85" stroke="blue" stroke-width="3" />
              <line x1="140" y1="70" x2="170" y2="100" stroke="blue" stroke-width="3" />`;
      if(reveal) {
         uncut.forEach(p => svg += `<rect x="${p[0]-2}" y="${p[1]-2}" width="24" height="24" fill="none" stroke="#00ff00" stroke-width="3" />`);
      }
      svg += `</svg>`;
    }
    else if(id === 'pzl-obs-xo-006') {
      let fork = "M 90 100 L 90 40 L 80 40 L 80 10 L 85 10 L 85 30 L 95 30 L 95 10 L 105 10 L 105 30 L 115 30 L 115 10 L 120 10 L 120 40 L 110 40 L 110 100 Z";
      svg = `<svg viewBox="0 0 200 150" width="100%" height="100%">
        <rect width="200" height="150" fill="#fff" />
        <path d="M0 150 L200 150 L200 0 L0 0 Z ${fork}" fill="#2c3e50" fill-rule="evenodd" />
      `;
      if(reveal) svg += `<path d="${fork}" fill="rgba(52, 152, 219, 0.4)" stroke="#3498db" stroke-width="2" />`;
      svg += `</svg>`;
    }
    else if(id === 'pzl-obs-bmb-001') {
      let icon = (x, y, dotTop) => `<rect x="${x}" y="${y}" width="15" height="15" fill="none" stroke="#000" stroke-width="2"/><circle cx="${x+7.5}" cy="${dotTop ? y+4 : y+11}" r="2" fill="#000"/>`;
      svg = `<svg viewBox="0 0 200 200" width="100%" height="100%">
        <line x1="100" y1="0" x2="100" y2="200" stroke="#ccc" />
        <line x1="0" y1="100" x2="200" y2="100" stroke="#ccc" />
        <text x="10" y="20" font-size="16">أ</text><text x="110" y="20" font-size="16">ب</text>
        <text x="10" y="120" font-size="16">ج</text><text x="110" y="120" font-size="16">د</text>`;
      for(let i=0; i<4; i++) {
        for(let j=0; j<4; j++) {
          svg += icon(20 + j*18, 30 + i*18, true); // A
          svg += icon(120 + j*18, 30 + i*18, true); // B
          svg += icon(120 + j*18, 130 + i*18, true); // D
          let dotTop = !(i===2 && j===2);
          svg += icon(20 + j*18, 130 + i*18, dotTop); // C
        }
      }
      if(reveal) svg += `<circle cx="${20+2*18+7.5}" cy="${130+2*18+7.5}" r="12" fill="none" stroke="red" stroke-width="2" />`;
      svg += `</svg>`;
    }
    else if(id === 'pzl-obs-bmb-002') {
      svg = `<svg viewBox="0 0 200 200" width="100%" height="100%">
        <line x1="20" y1="100" x2="180" y2="100" stroke="green" stroke-width="20" />
        <line x1="100" y1="20" x2="100" y2="180" stroke="red" stroke-width="20" />
        <line x1="20" y1="20" x2="180" y2="180" stroke="blue" stroke-width="20" />
        <line x1="180" y1="20" x2="20" y2="180" stroke="gold" stroke-width="20" />
      `;
      if(reveal) svg += `<rect x="10" y="90" width="180" height="20" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="4" />`;
      svg += `</svg>`;
    }
    else if(id === 'pzl-obs-ryo-001') {
      svg = `<svg viewBox="0 0 200 200" width="100%" height="100%">`;
      let k=0;
      for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
          let x = 25 + c*50; let y = 30 + r*45;
          let color = ["red", "gold", "blue", "green"][k%4];
          let hasGlasses = !(k===5); 
          if(k===5) color = "gold";
          svg += `<path d="M${x-15},${y+20} C${x-15},${y+5} ${x+15},${y+5} ${x+15},${y+20} Z" fill="${color}" />`;
          svg += `<circle cx="${x}" cy="${y-10}" r="10" fill="#fcd5ce" />`;
          if(color==="gold") svg += `<path d="M${x},${y+7} L${x-3},${y+15} L${x+4},${y+10} L${x-4},${y+10} L${x+3},${y+15} Z" fill="#fff" />`;
          if(color==="red") svg += `<circle cx="${x}" cy="${y+12}" r="4" fill="#fff" />`;
          if(color==="blue") { svg += `<line x1="${x-10}" y1="${y+9}" x2="${x+10}" y2="${y+9}" stroke="#fff" stroke-width="2" />`; svg += `<line x1="${x-10}" y1="${y+15}" x2="${x+10}" y2="${y+15}" stroke="#fff" stroke-width="2" />`; }
          if(color==="green") svg += `<polygon points="${x},${y+8} ${x-4},${y+15} ${x+4},${y+15}" fill="#fff" />`;
          if(hasGlasses) {
            svg += `<circle cx="${x-4}" cy="${y-12}" r="3" fill="none" stroke="#333" stroke-width="1.5" />`;
            svg += `<circle cx="${x+4}" cy="${y-12}" r="3" fill="none" stroke="#333" stroke-width="1.5" />`;
            svg += `<line x1="${x-1}" y1="${y-12}" x2="${x+1}" y2="${y-12}" stroke="#333" stroke-width="1.5" />`;
          }
          k++;
        }
      }
      if(reveal) svg += `<circle cx="75" cy="75" r="25" fill="none" stroke="red" stroke-width="3" />`;
      svg += `</svg>`;
    }
    else if(id === 'pzl-obs-ryo-002') {
      svg = `<svg viewBox="0 0 200 200" width="100%" height="100%">`;
      let angles = [0, 45, 90, 135, 180, 225, 270, 315];
      let smooth = [2, 5];
      angles.forEach((a, idx) => {
         let isSmooth = smooth.includes(idx);
         let teeth = isSmooth ? `L105,60 L105,120` : `L105,60 L105,70 L110,75 L105,80 L110,85 L105,90 L105,120`;
         let path = `M95,120 L95,60 A15,15 0 1,1 105,60 ${teeth} Z`;
         svg += `<g transform="translate(100,100) rotate(${a}) translate(-100,-100)">
            <path d="${path}" fill="#ccc" stroke="#333" stroke-width="2" />
            <circle cx="100" cy="45" r="5" fill="#fff" stroke="#333" stroke-width="2" />
         </g>`;
      });
      svg += `<circle cx="100" cy="100" r="20" fill="none" stroke="#888" stroke-width="4" />`;
      if(reveal) {
         smooth.forEach(idx => {
           svg += `<g transform="translate(100,100) rotate(${angles[idx]}) translate(-100,-100)">
             <rect x="85" y="60" width="30" height="70" fill="none" stroke="red" stroke-width="2" />
           </g>`;
         });
      }
      svg += `</svg>`;
    }
    else if(id === 'pzl-obs-cls-001') {
      svg = `<svg viewBox="0 0 200 200" width="100%" height="100%">`;
      for(let i=0; i<87; i++) {
         let x = 15 + (hash(i*13)*170);
         let y = 15 + (hash(i*17)*170);
         if(i<27) {
           svg += `<polygon points="${x},${y-5} ${x-5},${y+5} ${x+5},${y+5}" fill="blue" />`;
           if(reveal) svg += `<circle cx="${x}" cy="${y}" r="8" fill="none" stroke="gold" stroke-width="2" />`;
         }
         else if(i<57) svg += `<circle cx="${x}" cy="${y}" r="4" fill="red" />`;
         else svg += `<rect x="${x-4}" y="${y-4}" width="8" height="8" fill="green" />`;
      }
      svg += `</svg>`;
    }
    else if(id === 'pzl-obs-cls-002') {
      svg = `<svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect x="0" y="0" width="100" height="100" fill="#fff" stroke="#ccc" stroke-width="1" />
        <rect x="10" y="10" width="30" height="40" fill="#000" />
        <rect x="45" y="55" width="50" height="30" fill="#000" />
        <rect x="50" y="10" width="35" height="20" fill="#000" />
      `;
      if(reveal) {
        svg += `<text x="25" y="30" fill="red" font-size="6" text-anchor="middle">30x40=1200</text>
                <text x="70" y="70" fill="red" font-size="6" text-anchor="middle">50x30=1500</text>
                <text x="67" y="20" fill="red" font-size="6" text-anchor="middle">35x20=700</text>
                <rect x="20" y="42" width="60" height="10" fill="white" stroke="red" stroke-width="0.5"/>
                <text x="50" y="49" fill="red" font-size="6" text-anchor="middle">المجموع: 3400 (34%)</text>`;
      }
      svg += `</svg>`;
    }
  } catch(e) {
    console.error('Error rendering ' + id, e);
    svg = `<div style="color:red; padding:20px; text-align:center;">Failed to render: ${e.message}</div>`;
  }
  return svg;
}

function init() {
  console.log('[gallery] artifact items loaded:', batch.questions.length);
  updateStats();
  renderGrid('all');
}

function updateStats() {
  let app = 0, warn = 0, rej = 0;
  batch.questions.forEach(q => {
    let s = localStorage.getItem('rev_' + q.id);
    if(s === 'up') app++;
    if(s === 'warn') warn++;
    if(s === 'down') rej++;
  });
  document.getElementById('stats').innerHTML = 
    `Reviewed: ${app+warn+rej} / 12 &nbsp;|&nbsp; ✅ Approved: ${app} &nbsp;|&nbsp; 🟡 Needs changes: ${warn} &nbsp;|&nbsp; ❌ Rejected: ${rej}`;
}

function renderGrid(filterType) {
  try {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    let activeTab = document.querySelector(`.tab[data-filter="${filterType}"]`);
    if(activeTab) activeTab.classList.add('active');
    
    let grid = document.getElementById('gallery-grid');
    grid.innerHTML = '';
    let renderedCount = 0;
    
    batch.questions.forEach(q => {
      let mechKey = getMechanicKey(q.id);
      if(filterType !== 'all' && mechKey !== filterType) return;
      
      let el = document.createElement('div');
      el.className = 'card';
      el.onclick = () => openDetail(q.id);
      
      el.innerHTML = `
        <div class="card-header">
          <span class="badge">${q.id.split('-')[1].toUpperCase()} / ${mechKey.toUpperCase()}</span>
          <span class="diff">${q.authoring.difficulty}</span>
        </div>
        <div class="prompt-preview">${q.prompt.ar}</div>
        <div class="thumb">${renderSVG(q.id, false)}</div>
      `;
      grid.appendChild(el);
      renderedCount++;
    });
    
    document.getElementById('render-status').innerText = `Rendered cards: ${renderedCount} / 12`;
    console.log(`[gallery] cards rendered for filter '${filterType}':`, renderedCount);
  } catch(e) {
    document.getElementById('error-panel').style.display = 'block';
    document.getElementById('error-panel').innerHTML = 'Error rendering grid: ' + e.message;
    console.error(e);
  }
}

function openDetail(id) {
  try {
    currentItem = batch.questions.find(q => q.id === id);
    if(!currentItem) return;
    
    isRevealed = false;
    isMobile = false;
    
    document.getElementById('gallery-grid').style.display = 'none';
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('render-status').style.display = 'none';
    document.getElementById('detail-view').style.display = 'block';
    
    document.getElementById('d-mechanic').innerText = currentItem.id.split('-')[1].toUpperCase();
    document.getElementById('d-diff').innerText = currentItem.authoring.difficulty;
    document.getElementById('d-prompt').innerText = currentItem.prompt.ar;
    
    document.getElementById('reveal-btn').innerText = 'إظهار الإجابة';
    document.getElementById('d-details').style.display = 'none';
    
    let md = currentItem.mediaIntent || {};
    document.getElementById('d-details').innerHTML = `<strong>البناء (Class ${md.mediaConstructionClass || '?'}):</strong> ${md.description || 'none'}<br><br><strong>تفاصيل مهمة:</strong> ${md.criticalDetails || 'none'}`;
    
    let reviewState = localStorage.getItem('rev_' + id);
    document.querySelectorAll('.review-btn').forEach(b => b.classList.remove('selected'));
    if(reviewState) {
      let b = document.getElementById('btn-' + reviewState);
      if(b) b.classList.add('selected');
    }
    document.getElementById('d-notes').value = localStorage.getItem('note_' + id) || '';
    
    renderStage();
    renderOptions();
  } catch(e) {
    document.getElementById('error-panel').style.display = 'block';
    document.getElementById('error-panel').innerHTML = 'Error opening detail: ' + e.message;
  }
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('gallery-grid').style.display = 'grid';
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('render-status').style.display = 'block';
  updateStats();
}

function toggleReveal() {
  isRevealed = !isRevealed;
  document.getElementById('reveal-btn').innerText = isRevealed ? 'إخفاء الإجابة' : 'إظهار الإجابة';
  renderStage();
  renderOptions();
}

function toggleMobile() {
  isMobile = !isMobile;
  renderStage();
}

function toggleDetails() {
  let el = document.getElementById('d-details');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function renderStage() {
  try {
    let stage = document.getElementById('d-stage');
    stage.className = isMobile ? 'puzzle-stage mobile-view' : 'puzzle-stage';
    stage.innerHTML = renderSVG(currentItem.id, isRevealed);
  } catch (e) {
    console.error('Stage render error', e);
  }
}

function renderOptions() {
  let ol = document.getElementById('d-options');
  ol.innerHTML = '';
  
  if (currentItem.answerMode === 'multiple_choice') {
    currentItem.answerPayload.options.forEach(opt => {
      let isCorrect = (opt.id === currentItem.answerPayload.correctOptionId);
      ol.innerHTML += `<li class="option ${isRevealed && isCorrect ? 'correct' : ''}">${opt.label.ar}</li>`;
    });
  } else if (currentItem.answerMode === 'match') {
    if(isRevealed) ol.innerHTML = `<li class="option correct">Match accepted (Check config)</li>`;
  } else if (currentItem.answerMode === 'closest') {
    if(isRevealed) ol.innerHTML = `<li class="option correct">الهدف: ${currentItem.correctValue || (currentItem.answerPayload && currentItem.answerPayload.targetValue)}</li>`;
  }
}

function setReview(val) {
  localStorage.setItem('rev_' + currentItem.id, val);
  document.querySelectorAll('.review-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('btn-' + val).classList.add('selected');
  updateStats();
}

function saveNote(val) {
  localStorage.setItem('note_' + currentItem.id, val);
}

// Start application
init();
</script>
</body>
</html>
