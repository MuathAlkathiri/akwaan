<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arab Acting Stars - Clear-Window Geometry Review</title>
    <style>
        body { font-family: system-ui; background: #0f172a; color: white; padding: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 30px; }
        .card { background: #1e293b; border-radius: 8px; padding: 15px; border: 1px solid #334155; }
        .image-container { 
            position: relative; width: 100%; aspect-ratio: 1; 
            background-color: #000; overflow: hidden; border-radius: 4px;
        }
        .image-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-size: cover; background-position: center;
        }
        /* The obscured layer is a blurred or dark version, or we can just make the image black and reveal through clip-path or multiple divs */
        /* For simulation, we will use a black overlay, and then create absolute divs with background-image synced to the same background size/position, but clipped to the window! */
        .window-slice {
            position: absolute;
            background-size: 100% 100%; /* Since we stretch the image to container? No, we should use object-fit or absolute bounds. Let's use % */
            background-repeat: no-repeat;
            opacity: 0; /* hidden by default */
            transition: opacity 0.2s;
        }
        .window-slice.active {
            opacity: 1;
        }
        .debug-outline {
            position: absolute;
            border: 2px solid red;
            box-sizing: border-box;
            background: rgba(255, 0, 0, 0.2);
            pointer-events: none;
            display: none;
        }
        .show-debug .debug-outline {
            display: block;
        }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        button { background: #3b82f6; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
        button.active { background: #10b981; }
        button:hover { opacity: 0.9; }
        .btn-all { background: #6366f1; grid-column: 1 / -1; }
        .btn-debug { background: #ef4444; grid-column: 1 / -1; }
        .coords { font-family: monospace; font-size: 11px; color: #94a3b8; margin-top: 10px; white-space: pre; }
    </style>
</head>
<body>
    <h1>Arab Acting Stars — Geometry Pilot Review</h1>
    <div class="gallery" id="gallery"></div>

    <script>
        // We will fetch the JSON data generated by our python script
        fetch('../workbench/artifacts/arab_acting_geometry.json').then(r => r.json()).then(data => {
            const gallery = document.getElementById('gallery');
            
            // We need a mapping from name to image file
            const nameToImg = {
                "Suad Abdullah": "suad_abdullah.jpg",
                "Hayat Al-Fahad": "hayat_al_fahad.jpg",
                "Abdulhussain Abdulredha": "abdulhussain_abdulredha.jpg",
                "Huda Hussain": "huda_hussain.jpg",
                "Nasser Al-Qasabi": "nasser_al_qasabi.png",
                "Abdullah Al-Sadhan": "abdullah_al_sadhan.jpg",
                "Adel Emam": "adel_emam.jpg",
                "Ahmed Helmy": "ahmed_helmy.jpg",
                "Reem Abdullah": "reem_abdullah.jpg"
            };

            for (const [name, payload] of Object.entries(data)) {
                const windows = payload.regions;
                const card = document.createElement('div');
                card.className = 'card';
                const imgSrc = `media/${nameToImg[name]}`;
                
                let slicesHtml = '';
                let debugHtml = '';
                let btnsHtml = '';
                let coordsHtml = '';
                
                windows.forEach(w => {
                    const l = (w.shape.x * 100).toFixed(2);
                    const t = (w.shape.y * 100).toFixed(2);
                    const width = (w.shape.width * 100).toFixed(2);
                    const height = (w.shape.height * 100).toFixed(2);
                    
                    // To map the background perfectly inside the slice, we use background-position and background-size.
                    // Background size relative to the slice: 
                    // image is 100% of container. slice is width% of container. So bg size = 100 / width * 100 %
                    const bgSizeX = (100 / w.shape.width).toFixed(2);
                    const bgSizeY = (100 / w.shape.height).toFixed(2);
                    
                    // Background position: 
                    // offset from left is w.x. Relative to the leftover space:
                    const bgPosX = w.shape.width === 1 ? 0 : (w.shape.x / (1 - w.shape.width) * 100).toFixed(2);
                    const bgPosY = w.shape.height === 1 ? 0 : (w.shape.y / (1 - w.shape.height) * 100).toFixed(2);

                    slicesHtml += `<div class="window-slice" id="slice-${name}-${w.role}" 
                        style="left: ${l}%; top: ${t}%; width: ${width}%; height: ${height}%; 
                        background-image: url('${imgSrc}'); background-size: ${bgSizeX}% ${bgSizeY}%; 
                        background-position: ${bgPosX}% ${bgPosY}%;"></div>`;
                        
                    debugHtml += `<div class="debug-outline" style="left: ${l}%; top: ${t}%; width: ${width}%; height: ${height}%;"></div>`;
                    
                    btnsHtml += `<button onclick="toggle('${name}', '${w.role}')" id="btn-${name}-${w.role}">${w.role}</button>`;
                    coordsHtml += `${w.role}: x=${w.shape.x.toFixed(3)} y=${w.shape.y.toFixed(3)} w=${w.shape.width.toFixed(3)} h=${w.shape.height.toFixed(3)}\n`;
                });
                
                card.innerHTML = `
                    <h2>${name}</h2>
                    <div class="image-container" id="container-${name}">
                        <!-- Base fully obscured (black background is enough) -->
                        ${slicesHtml}
                        ${debugHtml}
                    </div>
                    <div class="controls">
                        ${btnsHtml}
                        <button class="btn-all" onclick="toggleAll('${name}')">Toggle All 6</button>
                        <button class="btn-debug" onclick="toggleDebug('${name}')">Toggle Debug Overlay</button>
                    </div>
                    <div class="coords">${coordsHtml}</div>
                `;
                gallery.appendChild(card);
            }
        });
        
        function toggle(name, role) {
            document.getElementById(`slice-${name}-${role}`).classList.toggle('active');
            document.getElementById(`btn-${name}-${role}`).classList.toggle('active');
        }
        function toggleAll(name) {
            const container = document.getElementById(`container-${name}`);
            const slices = container.querySelectorAll('.window-slice');
            const btns = document.getElementById(`container-${name}`).nextElementSibling.querySelectorAll('button:not(.btn-all):not(.btn-debug)');
            const anyHidden = Array.from(slices).some(s => !s.classList.contains('active'));
            slices.forEach(s => { if(anyHidden) s.classList.add('active'); else s.classList.remove('active'); });
            btns.forEach(b => { if(anyHidden) b.classList.add('active'); else b.classList.remove('active'); });
        }
        function toggleDebug(name) {
            document.getElementById(`container-${name}`).classList.toggle('show-debug');
        }
    </script>
</body>
</html>
